# =============================================================================
# One-command Jenkins setup for SE4206.
#
# Usage:
#     docker compose up -d --build
#     # Then open http://localhost:8081
#
# To stop:
#     docker compose down
#
# To wipe and start fresh (deletes all jobs/history):
#     docker compose down -v
# =============================================================================
version: "3.9"

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-server
    restart: unless-stopped
    ports:
      - "8081:8080"   # Jenkins UI  -> http://localhost:8081
      - "50000:50000" # Agent port (not used in this demo, but standard)
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount the host Docker socket so Jenkins can build & run containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

volumes:
  jenkins_home:
